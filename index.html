<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e6">
<title>人生ゲーム — LIFE IS A JOURNEY</title>
<link rel="stylesheet" href="style.css">
</head>
<body><div class="grain"></div><main class="shell"><header class="nav"><div class="brand"><span class="brandmark">↗</span><span>LIFE IS A JOURNEY</span></div><div class="navright">EST. 2024 <span class="pill">人生ゲーム</span></div></header>
<section class="view active" id="home"><div class="start"><div class="hero"><div class="eyebrow">YOUR STORY STARTS HERE</div><h1>人生は、<br><em>これから。</em></h1><p>仕事に恋に、ちょっとした運試し。ルーレットを回して、自分だけの人生を歩もう。</p><div class="startvisual"><span class="startcaption">A LITTLE ADVENTURE AWAITS</span><span class="sun"></span><span class="hill a"></span><span class="hill b"></span><span class="road"></span><span class="mini-car">🚙</span></div></div><div class="setup"><div class="setuphead"><strong>何人で遊びますか？</strong><span class="tiny">PLAYERS</span></div><div class="coursepick"><div class="tiny">コースを選ぶ</div><button type="button" class="coursebtn sel" data-course="100">しっかり人生　100マス</button><button type="button" class="coursebtn" data-course="50">お手軽人生　50マス</button></div><div class="count"><button class="sel" data-count="2">2 人</button><button data-count="3">3 人</button><button data-count="4">4 人</button><button data-count="5">5 人</button></div><div class="names" id="names"></div><button class="primary" id="startbtn">人生をはじめる　↗</button><div class="savehint">✦ ゲームの進行は自動で保存されます</div></div></div><div class="foot">TAKE A CHANCE. MAKE A CHOICE. LIVE YOUR STORY.</div></section>
<section class="view" id="play"><div class="game"><div class="board"><div class="boardtop"><div><div class="eyebrow">YOUR LIFE'S ROAD</div><h2>人生の旅路</h2></div><div class="progress" id="progress"></div></div><div class="track" id="track"></div><div class="routehint"><span>START — ここから出発</span><span>GOAL — 人生のゴール →</span></div></div><aside class="side"><div class="turncard" id="turncard"></div><div class="logcard"><div class="logtitle">✳　LIFE NOTES</div><div class="log" id="log"></div></div></aside></div></section>
<section class="view" id="ending"><div class="finish" id="finish"></div></section></main><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<script src="game.js" defer></script></body></html>
